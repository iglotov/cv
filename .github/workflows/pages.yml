name: Build and deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Render CV PDFs
        run: make render

      - name: Verify generated PDFs
        run: |
          test -s Ilia_Glotov_SRE.pdf
          test -s Ilia_Glotov_SRE-ru.pdf

      - name: Create legacy PDF aliases
        run: |
          ln -s Ilia_Glotov_SRE.pdf ilia_glotov_cv.pdf
          ln -s Ilia_Glotov_SRE-ru.pdf ilia_glotov_cv_ru.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify site artifact
        run: |
          test -s _site/index.html
          test -s _site/version.json
          test -s _site/Ilia_Glotov_SRE.pdf
          test -s _site/Ilia_Glotov_SRE-ru.pdf
          grep -Fq "$GITHUB_SHA" _site/index.html
          grep -Fq "$GITHUB_SHA" _site/version.json
          test -z "$(find _site -type l -print -quit)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
